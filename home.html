<!doctype html>
<html lang="en" data-theme="default">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Payoo | Home</title>
    <link rel="shortcut icon" href="assets/logo.png" type="image/x-icon" />

    <!-- Tailwind and Daisy UI -->
    <link
      href="https://cdn.jsdelivr.net/npm/daisyui@5"
      rel="stylesheet"
      type="text/css"
    />
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5/themes.css" rel="stylesheet" type="text/css" />

    <!-- Font-Outfit -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@200..800&family=Outfit:wght@100..900&display=swap"
      rel="stylesheet"
    />

    

    <!-- icons -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
      integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <style>
      * {
        font-family: "Outfit", sans-serif;
      }
    </style>
  </head>
  <body class="min-h-screen max-w-md bg-base-200 mx-auto">
  
        <header class="border-b-2 border-gray-400 p-3">
                 <section class="w-11/12 mx-auto flex justify-between items-center">
                    
                     <div class="left flex gap-1">
                        <div class="logo w-[60px]">
                             <img src="assets/logo.png" alt="">
                        </div>
                        <div id="balance-info">
                             <h2 class="font-semibold text-2xl">$<span id="balance">45000</span></h2>
                             <p class="opacity-60">Available Balance</p>
                        </div>
                    </div>
                    
                     <div class="right">
                         <div class="btn btn-soft btn-primary"> 
                                 <a href="index.html">Log out <i class="fa-solid fa-arrow-right-from-bracket mx-1"></i></a>
                         </div>
                     </div>
                 </section>
        </header>

        <section class="w-11/12 space-y-5 mx-auto py-3">
                   <h2 class="font-bold text-3xl">Welcome to Pay<span class="text-primary">oo</span></h2>
                   <p class="opacity-60">Enjoy easy and convenient financial services with us. Cashout charge is low and </p>

                   <div class="buttons grid grid-cols-3 gap-3">
                          <button class="btn flex-col h-full px-[39px] py-[20px] btn-primary btn-soft">
                                <img src="assets/opt-1.png" alt="">
                                <span class="font-normal">Add Money</span>
                          </button>
                          <button class="btn flex-col h-full px-[39px] py-[20px] btn-primary btn-soft">
                                <img src="assets/opt-2.png" alt="">
                                <span class="font-normal">Cashout</span>
                          </button>
                          <button class="btn flex-col h-full  px-[39px] py-[20px] btn-primary btn-soft">
                                <img src="assets/opt-3.png" alt="">
                                <span class="font-normal">Transfer Money</span>
                          </button>
                          <button class="btn flex-col h-full  px-[39px] py-[20px] btn-primary btn-soft">
                                <img src="assets/opt-4.png" alt="">
                                <span class="font-normal">Get bonus</span>
                          </button>
                          <button class="btn flex-col h-full  px-[39px] py-[20px] btn-primary btn-soft">
                                <img src="assets/opt-5.png" alt="">
                                <span class="font-normal">Pay Bill</span>
                          </button>
                          <button class="btn flex-col h-full  px-[39px] py-[20px] btn-primary btn-soft">
                                <img src="assets/opt-6.png" alt="">
                                <span class="font-normal">Transaction</span>
                          </button>
                    
                   </div>
                   
        </section>

        <section id="Cashout" class="w-11/12 mx-auto py-5">
            <h2 class="text-xl font-bold">Cashout</h2>
                     <div class="form pt-[10px]">
    <div class="card bg-base-100 w-full shadow-xl rounded-[24px]">
      <div class="card-body">
        <fieldset class="fieldset">
          <label  class="label font-bold text-neutral">Agent Number</label>
          <input  id="cashout-number" maxlength="11" minlength="11" type="text" class="input rounded-full w-full" placeholder="Enter agent number" />
          <br>
          <label  class="label font-bold text-neutral">Amount</label>
          <input id="cashout-amount" type="number" class="input rounded-full w-full" placeholder="Enter amount" />
          <br>
          <label class="label font-bold text-neutral">Pin Number</label>
          <input id="cashout-digit" maxlength="4" minlength="4" type="password" class="input rounded-full w-full" placeholder="Enter pin number" />
        
          <button id="Cashout-btn" class="btn btn-primary rounded-full mt-4">Withdraw Money</button>
        </fieldset>
      </div>
         </div>
        </section>
                  
                    
        <script src="java/cashout.js"></script>

  </body>
</html>
